<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Not found — Will West</title>
<meta name="robots" content="noindex">
<style>
  :root{--s0:#08080a;--w:#fff;--t2:#a8a8b2;--t4:#6b6b76;
        --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
        --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--s0);color:var(--t2);font:16.5px/1.68 var(--sans);min-height:100svh;
       display:grid;place-items:center;padding:44px;-webkit-font-smoothing:antialiased}
  main{max-width:34rem}
  .kick{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;
        color:var(--t4);display:block;margin-bottom:22px}
  h1{font-size:clamp(30px,5vw,52px);line-height:1.05;letter-spacing:-.03em;color:var(--w);font-weight:700}
  p{margin-top:20px}
  a{color:var(--w);text-decoration:underline;text-underline-offset:4px;
    text-decoration-color:rgba(255,255,255,.3);transition:text-decoration-color .25s}
  a:hover{text-decoration-color:var(--w)}
  :focus-visible{outline:2px solid #6e6ef0;outline-offset:3px;border-radius:2px}
</style>
</head>
<body>
<main>
  <span class="kick">404</span>
  <h1>That page isn't here.</h1>
  <p>Try the <a href="/">main page</a>, or email <a href="mailto:willwwest87@gmail.com">willwwest87@gmail.com</a>.</p>
</main>
</body>
</html>
